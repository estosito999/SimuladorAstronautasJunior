<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador Espacial Unity 3D</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070d18; }
      canvas { display: block; width: 100%; height: 100%; outline-offset: -3px; }
      #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; color: #e2e8f0; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      #status[hidden] { display: none; }
    </style>
    <script src="./player.js" defer></script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0" aria-label="Simulador espacial original de Unity"></canvas>
    <div id="status" role="status" aria-live="polite">Cargando el simulador de Unity…</div>
  </body>
</html>
